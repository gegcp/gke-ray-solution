# Health check policies for vllm-gemma services
# These policies configure health checks for the ServiceImport backends
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: vllm-gemma-2b-it-healthcheck
  namespace: default
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 8000
        requestPath: /health
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: vllm-gemma-2b-it
---
