# Model Composition: Real-ESRGAN (TPU) → RepVGG (GPU)
# Chains super-resolution on TPU with image classification on GPU
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: composition-esrgan-repvgg
spec:
  serveConfigV2: |
    applications:
    - name: composition-app
      route_prefix: /
      import_path: composition_esrgan_repvgg_app:model
      runtime_env:
        pip: ["torch", "torchvision", "pillow", "numpy", "fastapi", "ray==2.55.1"]
        env_vars:
          PYTHONPATH: "/rayserve/apps:$PYTHONPATH"
  rayClusterConfig:
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "2"
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: composition
        spec:
          containers:
          - name: ray-head
            image: us-central1-docker.pkg.dev/gpu-launchpad-playground/gech-ray-gke/ray-tpu:2.55.1
            resources:
              limits:
                cpu: "2"
                memory: "8Gi"
                ephemeral-storage: "20Gi"
              requests:
                cpu: "2"
                memory: "8Gi"
                ephemeral-storage: "20Gi"
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
                  optional: true
            - name: PYTHONPATH
              value: "/rayserve/apps:$PYTHONPATH"
            volumeMounts:
            - name: composition-apps
              mountPath: /rayserve/apps
              readOnly: true
          volumes:
          - name: composition-apps
            configMap:
              name: composition-apps
    workerGroupSpecs:
    # GPU worker for RepVGG classification
    - replicas: 1
      minReplicas: 0
      maxReplicas: 1
      groupName: gpu-group
      rayStartParams: {}
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: composition
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray:2.55.1.68d0e4-extra-py312-cu128
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
                  optional: true
            - name: PYTHONPATH
              value: "/rayserve/apps:$PYTHONPATH"
            - name: MODEL_VARIANT
              value: "B0"
            - name: NUM_CLASSES
              value: "1000"
            - name: USE_FP16
              value: "true"
            resources:
              limits:
                cpu: "2"
                memory: "10Gi"
                nvidia.com/gpu: "1"
                ephemeral-storage: "10Gi"
              requests:
                cpu: "2"
                memory: "10Gi"
                nvidia.com/gpu: "1"
                ephemeral-storage: "10Gi"
            volumeMounts:
            - name: composition-apps
              mountPath: /rayserve/apps
              readOnly: true
          volumes:
          - name: composition-apps
            configMap:
              name: composition-apps
          nodeSelector:
            cloud.google.com/gke-accelerator: nvidia-l4
    # TPU worker for Real-ESRGAN upscaling
    - groupName: tpu-group
      replicas: 1
      minReplicas: 0
      maxReplicas: 1
      numOfHosts: 1
      rayStartParams: {}
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: composition
        spec:
          containers:
            - name: ray-worker
              image: us-central1-docker.pkg.dev/gpu-launchpad-playground/gech-ray-gke/ray-tpu:2.55.1
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: "1"
                  google.com/tpu: "1"
                  ephemeral-storage: 40G
                  memory: 20G
                requests:
                  cpu: "1"
                  google.com/tpu: "1"
                  ephemeral-storage: 40G
                  memory: 20G
              env:
                - name: HUGGING_FACE_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_api_token
                      optional: true
                - name: PYTHONPATH
                  value: "/rayserve/apps:$PYTHONPATH"
                - name: MODEL_NAME
                  value: "RealESRGAN_x4plus"
                - name: SCALE
                  value: "4"
                - name: ENABLE_TPU
                  value: "true"
                - name: TPU_LIBRARY_PATH
                  value: "/home/ray/anaconda3/lib/python3.12/site-packages/libtpu/libtpu.so"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: composition-apps
                mountPath: /rayserve/apps
                readOnly: true
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: composition-apps
            configMap:
              name: composition-apps
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 1x1
# [END]
