# Real-ESRGAN GPU and TPU Inference RayService
# Deploy Real-ESRGAN super-resolution models on GPU (NVIDIA L4) and TPU (v6e)
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: realesrgan-gpu-tpu
spec:
  serveConfigV2: |
    applications:
    - name: gpu-app
      route_prefix: /gpu
      import_path: realesrgan_gpu_app:model
      deployments:
      - name: RealESRGANDeployment
        num_replicas: 1
        ray_actor_options:
          num_cpus: 2
          num_gpus: 1
      runtime_env:
        pip: ["torch", "torchvision", "pillow", "numpy", "fastapi", "ray==2.55.1"]
        env_vars:
          MODEL_NAME: "RealESRGAN_x4plus"
          SCALE: "4"
          USE_FP16: "true"
          TILE_SIZE: "512"
          TILE_PAD: "10"
          # WEIGHT_PATH: "/path/to/RealESRGAN_x4plus.pth"  # Uncomment and set if weights available
    - name: tpu-app
      route_prefix: /tpu
      import_path: realesrgan_tpu_app:model
      deployments:
      - name: RealESRGANDeployment
        num_replicas: 1
        ray_actor_options:
          num_cpus: 1
          resources: {"TPU": 1}
      runtime_env:
        env_vars:
          MODEL_NAME: "RealESRGAN_x4plus"
          SCALE: "4"
          ENABLE_TPU: "true"
          # WEIGHT_PATH: "/path/to/RealESRGAN_x4plus.pth"  # Uncomment and set if weights available
  rayClusterConfig:
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "0"
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: realesrgan
        spec:
          containers:
          - name: ray-head
            image: us-central1-docker.pkg.dev/gpu-launchpad-playground/gech-ray-gke/ray-tpu:2.55.1
            resources:
              limits:
                cpu: "2"
                memory: "8Gi"
                ephemeral-storage: "20Gi"
              requests:
                cpu: "2"
                memory: "8Gi"
                ephemeral-storage: "20Gi"
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
                  optional: true
            - name: PYTHONPATH
              value: "/rayserve/apps:$PYTHONPATH"
            volumeMounts:
            - name: realesrgan-apps
              mountPath: /rayserve/apps
              readOnly: true
            # Uncomment to mount model weights from persistent volume
            # - name: model-weights
            #   mountPath: /models
            #   readOnly: true
          volumes:
          - name: realesrgan-apps
            configMap:
              name: realesrgan-apps
          # Uncomment to mount model weights
          # - name: model-weights
          #   persistentVolumeClaim:
          #     claimName: realesrgan-weights-pvc
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 0
      maxReplicas: 1
      groupName: gpu-group
      rayStartParams: {}
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: realesrgan
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray:2.55.1.68d0e4-extra-py312-cu128
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
                  optional: true
            - name: PYTHONPATH
              value: "/rayserve/apps:$PYTHONPATH"
            resources:
              limits:
                cpu: "2"
                memory: "10Gi"
                nvidia.com/gpu: "1"
                ephemeral-storage: "10Gi"
              requests:
                cpu: "2"
                memory: "10Gi"
                nvidia.com/gpu: "1"
                ephemeral-storage: "10Gi"
            volumeMounts:
            - name: realesrgan-apps
              mountPath: /rayserve/apps
              readOnly: true
            # Uncomment to mount model weights
            # - name: model-weights
            #   mountPath: /models
            #   readOnly: true
          volumes:
          - name: realesrgan-apps
            configMap:
              name: realesrgan-apps
          # Uncomment to mount model weights
          # - name: model-weights
          #   persistentVolumeClaim:
          #     claimName: realesrgan-weights-pvc
          nodeSelector:
            cloud.google.com/gke-accelerator: nvidia-l4
    - groupName: tpu-group
      replicas: 1
      minReplicas: 0
      maxReplicas: 1
      numOfHosts: 1
      rayStartParams: {}
      template:
        metadata:
          labels:
            ai.gke.io: rayserve
            app: realesrgan
          annotations:
            # Uncomment for GCS FUSE if model weights stored in GCS
            # gke-gcsfuse/volumes: "true"
            # gke-gcsfuse/cpu-limit: "0"
            # gke-gcsfuse/memory-limit: "0"
            # gke-gcsfuse/ephemeral-storage-limit: "0"
        spec:
          containers:
            - name: ray-worker
              image: us-central1-docker.pkg.dev/gpu-launchpad-playground/gech-ray-gke/ray-tpu:2.55.1
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: "1"
                  google.com/tpu: "1"
                  ephemeral-storage: 40G
                  memory: 20G
                requests:
                  cpu: "1"
                  google.com/tpu: "1"
                  ephemeral-storage: 40G
                  memory: 20G
              env:
                - name: HUGGING_FACE_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_api_token
                      optional: true
                - name: PYTHONPATH
                  value: "/rayserve/apps:$PYTHONPATH"
                - name: MODEL_NAME
                  value: "RealESRGAN_x4plus"
                - name: SCALE
                  value: "4"
                - name: ENABLE_TPU
                  value: "true"
                - name: TPU_LIBRARY_PATH
                  value: "/home/ray/anaconda3/lib/python3.12/site-packages/libtpu/libtpu.so"
                # Uncomment and set if weights available
                # - name: WEIGHT_PATH
                #   value: "/models/RealESRGAN_x4plus.pth"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: realesrgan-apps
                mountPath: /rayserve/apps
                readOnly: true
              # Uncomment to mount model weights
              # - name: model-weights
              #   mountPath: /models
              #   readOnly: true
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: realesrgan-apps
            configMap:
              name: realesrgan-apps
          # Uncomment to mount model weights
          # - name: model-weights
          #   persistentVolumeClaim:
          #     claimName: realesrgan-weights-pvc
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 1x1
# [END]
